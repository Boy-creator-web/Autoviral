# Final production Nginx configuration for synapsetech.my.id
# - Serves static landing page from /var/www/autoviral
# - Proxies API requests to FastAPI container on localhost:8000
# - SSL certificates are managed by certbot

server {
    listen 80;
    listen [::]:80;
    server_name synapsetech.my.id www.synapsetech.my.id;

    # Certbot can use this if needed
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name synapsetech.my.id www.synapsetech.my.id;

    ssl_certificate /etc/letsencrypt/live/synapsetech.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synapsetech.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/autoviral;
    index index.html;

    # Main website
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI backend routes
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # FastAPI docs and openapi
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
